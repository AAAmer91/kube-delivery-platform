name: "Build, Scan, and Publish Production Images"

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: "Build, scan, and publish / ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/aaamer91/${{ matrix.service.name }}
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: shipment-api
            context: services/shipment-api
            dockerfile: services/shipment-api/Dockerfile
          - name: tracking-worker
            context: services/tracking-worker
            dockerfile: services/tracking-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Multi-Architecture Image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Generate CycloneDX image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ matrix.service.name }}.sbom.cdx.json

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.service.name }}.sbom.cdx.json
          push-to-registry: true

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.service.name }}-sbom
          path: ${{ matrix.service.name }}.sbom.cdx.json
          if-no-files-found: error

      - name: Publish immutable image coordinates
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE_NAME: ${{ matrix.service.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          digest_pattern='^sha256:[a-f0-9]{64}$'
          if [[ ! "${DIGEST}" =~ ${digest_pattern} ]]; then
            echo "::error title=Invalid image digest::Buildx did not return a valid OCI digest."
            exit 1
          fi

          case "${SERVICE_NAME}" in
            shipment-api) promotion_input="shipment_api_digest" ;;
            tracking-worker) promotion_input="tracking_worker_digest" ;;
            *)
              echo "::error title=Unknown service::No GitOps input mapping exists for ${SERVICE_NAME}."
              exit 1
              ;;
          esac

          short_sha="${SOURCE_SHA:0:7}"
          immutable_ref="${IMAGE_NAME}@${DIGEST}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}"

          {
            echo "# Published image: ${SERVICE_NAME}"
            echo
            echo "The vulnerability scan, SBOM generation, and provenance attestations completed before these coordinates were published."
            echo
            echo "| Coordinate | Value |"
            echo "| --- | --- |"
            printf '| Service | `%s` |\n' "${SERVICE_NAME}"
            printf '| Source commit | [`%s`](%s) |\n' "${SOURCE_SHA}" "${commit_url}"
            printf '| Source tag | `sha-%s` |\n' "${short_sha}"
            printf '| OCI manifest digest | `%s` |\n' "${DIGEST}"
            printf '| Immutable image | `%s` |\n' "${immutable_ref}"
            echo
            echo "## GitOps promotion input"
            echo
            echo '```text'
            printf '%s=%s\n' "${promotion_input}" "${DIGEST}"
            echo '```'
            echo
            echo "> Use the OCI manifest digest—not the commit SHA or source tag—when running the GitOps promotion workflow."
          } >> "${GITHUB_STEP_SUMMARY}"
