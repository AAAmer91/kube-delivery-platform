name: "PR Quality Gates & Validation"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Quality Gate 1: Go Service Testing & Linting
  # ============================================================================
  test-shipment-api:
    name: "Unit Tests & Lint / shipment-api (Go)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2aeab7976c79664de53a5166f39 # v5.1.0
        with:
          go-version: "1.23"
          cache-dependency-path: services/shipment-api/go.sum

      - name: Run Go Unit Tests with Race Detection
        working-directory: services/shipment-api
        run: |
          go test -v -race -coverprofile=coverage.out ./...

  # ============================================================================
  # Quality Gate 2: Python Worker Testing & Linting
  # ============================================================================
  test-tracking-worker:
    name: "Unit Tests & Lint / tracking-worker (Python)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/tracking-worker/dev-requirements.txt

      - name: Run Ruff Lint & Format Check
        run: |
          python -m ruff check services/tracking-worker tests scripts
          python -m ruff format --check services/tracking-worker tests scripts

      - name: Run Mypy Type Checking
        run: |
          python -m mypy services/tracking-worker/src

      - name: Run Python Unit & Contract Tests
        run: |
          python -m pytest services/tracking-worker/tests tests/contract tests/integration -v --cov=services/tracking-worker/src

  # ============================================================================
  # Quality Gate 3: Dockerfile Security & Best Practices (Hadolint)
  # ============================================================================
  lint-dockerfiles:
    name: "Dockerfile Lint & Security (Hadolint)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Hadolint on shipment-api Dockerfile
        uses: hadolint/hadolint-action@54c9adabbbe458c33d42686164cf384911e9675e # v3.1.0
        with:
          dockerfile: services/shipment-api/Dockerfile
          failure-threshold: warning

      - name: Run Hadolint on tracking-worker Dockerfile
        uses: hadolint/hadolint-action@54c9adabbbe458c33d42686164cf384911e9675e # v3.1.0
        with:
          dockerfile: services/tracking-worker/Dockerfile
          failure-threshold: warning

  # ============================================================================
  # Quality Gate 4: Helm Chart Lint & Template Validation
  # ============================================================================
  lint-helm-chart:
    name: "Helm Chart Lint & Template Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee101d5da0498030407de609044467a # v4.2.0
        with:
          version: "v3.16.2"

      - name: Helm Lint Umbrella Chart
        run: |
          helm lint deploy/helm/kube-delivery-platform

      - name: Helm Template Dry-Run (Preview Values)
        run: |
          helm template test-preview deploy/helm/kube-delivery-platform -f deploy/helm/kube-delivery-platform/values-preview.yaml > /dev/null

      - name: Helm Template Dry-Run (Staging Values)
        run: |
          helm template test-staging deploy/helm/kube-delivery-platform -f deploy/helm/kube-delivery-platform/values-staging.yaml > /dev/null

      - name: Helm Template Dry-Run (Production Values)
        run: |
          helm template test-prod deploy/helm/kube-delivery-platform -f deploy/helm/kube-delivery-platform/values-prod.yaml > /dev/null

      - name: Validate Kubernetes & Policy Manifest Schemas
        run: |
          python -m pip install pyyaml
          python scripts/verify_manifests.py
