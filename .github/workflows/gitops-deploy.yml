name: "GitOps Progressive Delivery & Promotion"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      shipment_api_digest:
        description: "shipment-api digest (sha256:...)"
        required: true
        type: string
      tracking_worker_digest:
        description: "tracking-worker digest (sha256:...)"
        required: true
        type: string

permissions:
  attestations: read
  contents: write
  deployments: write
  packages: read
  pull-requests: write

concurrency:
  group: gitops-promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote-gitops-state:
    name: "Promote Environment State via GitOps"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable image digests
        env:
          SHIPMENT_API_DIGEST: ${{ inputs.shipment_api_digest }}
          TRACKING_WORKER_DIGEST: ${{ inputs.tracking_worker_digest }}
        run: |
          digest_pattern='^sha256:[a-f0-9]{64}$'
          [[ "${SHIPMENT_API_DIGEST}" =~ ${digest_pattern} ]]
          [[ "${TRACKING_WORKER_DIGEST}" =~ ${digest_pattern} ]]

      - name: Verify image build provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPMENT_API_DIGEST: ${{ inputs.shipment_api_digest }}
          TRACKING_WORKER_DIGEST: ${{ inputs.tracking_worker_digest }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/build-and-publish.yml"
          gh attestation verify "oci://ghcr.io/aaamer91/shipment-api@${SHIPMENT_API_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${signer_workflow}"
          gh attestation verify "oci://ghcr.io/aaamer91/tracking-worker@${TRACKING_WORKER_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${signer_workflow}"

      - name: Update only application image digests
        env:
          VALUES_FILE: ${{ inputs.environment == 'production' && 'deploy/helm/kube-delivery-platform/values-prod.yaml' || 'deploy/helm/kube-delivery-platform/values-staging.yaml' }}
          SHIPMENT_API_DIGEST: ${{ inputs.shipment_api_digest }}
          TRACKING_WORKER_DIGEST: ${{ inputs.tracking_worker_digest }}
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          path = Path(os.environ["VALUES_FILE"])
          values = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          values.setdefault("shipmentApi", {}).setdefault("image", {})["digest"] = os.environ["SHIPMENT_API_DIGEST"]
          values.setdefault("trackingWorker", {}).setdefault("image", {})["digest"] = os.environ["TRACKING_WORKER_DIGEST"]
          path.write_text(yaml.safe_dump(values, sort_keys=False), encoding="utf-8")
          PY

      - name: Validate rendered GitOps state
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: "v3.16.2"

      - name: Render promoted Helm release
        env:
          VALUES_FILE: ${{ inputs.environment == 'production' && 'deploy/helm/kube-delivery-platform/values-prod.yaml' || 'deploy/helm/kube-delivery-platform/values-staging.yaml' }}
        run: helm template promotion deploy/helm/kube-delivery-platform --values "${VALUES_FILE}" > /dev/null

      - name: Open auditable promotion pull request
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          VALUES_FILE: ${{ inputs.environment == 'production' && 'deploy/helm/kube-delivery-platform/values-prod.yaml' || 'deploy/helm/kube-delivery-platform/values-staging.yaml' }}
        run: |
          branch="gitops/promote-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add "${VALUES_FILE}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Requested digests already match ${ENVIRONMENT_NAME}; no promotion PR is needed."
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          git commit -m "chore(gitops): promote ${ENVIRONMENT_NAME} image digests"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(gitops): promote ${ENVIRONMENT_NAME}" \
            --body "Promotes immutable application image digests after verified GitHub build-provenance attestations through the protected GitOps path."

      - name: Verify GitOps Reconcile Readiness
        run: |
          if [[ "${{ steps.promotion.outputs.changed }}" == "true" ]]; then
            echo "GitOps promotion PR opened for ${{ inputs.environment }}."
            echo "Argo CD will reconcile only after the audited desired-state change is merged."
          else
            echo "No desired-state change was required for ${{ inputs.environment }}."
          fi
