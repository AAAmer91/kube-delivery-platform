name: "Ephemeral Kind Cluster Integration & Resilience"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-integration:
    name: "Kind Kubernetes Runtime & Chaos Drills"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: python -m pip install -r services/tracking-worker/dev-requirements.txt

      - name: Build Local Test Images
        run: |
          docker buildx build --load \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --tag ghcr.io/aaamer91/shipment-api:test \
            --file services/shipment-api/Dockerfile \
            services/shipment-api
          docker buildx build --load \
            --tag ghcr.io/aaamer91/tracking-worker:test \
            --file services/tracking-worker/Dockerfile \
            services/tracking-worker

      - name: Setup Kind Platform Cluster
        uses: ./.github/actions/setup-kind-platform
        with:
          cluster_name: "kube-delivery-ci"
          config_path: "deploy/kind/kind-config.yaml"

      - name: Load Images into Kind Cluster
        run: |
          kind load docker-image ghcr.io/aaamer91/shipment-api:test --name kube-delivery-ci
          kind load docker-image ghcr.io/aaamer91/tracking-worker:test --name kube-delivery-ci

      - name: Enforce Kyverno Governance in Preview Namespace
        run: |
          kubectl create namespace delivery-preview
          kubectl label namespace delivery-preview platform.kube-delivery.io/security-profile=restricted
          kubectl label namespace delivery-preview pod-security.kubernetes.io/enforce=restricted
          kubectl label namespace delivery-preview pod-security.kubernetes.io/enforce-version=latest
          kubectl apply -f deploy/policies
          kubectl wait --for=condition=Ready clusterpolicy --all --timeout=120s

      - name: Deploy Umbrella Helm Chart to Ephemeral Namespace
        run: |
          DATABASE_PASSWORD="$(openssl rand -hex 24)"
          kubectl create secret generic kube-delivery-database \
            --namespace delivery-preview \
            --from-literal=POSTGRES_PASSWORD="${DATABASE_PASSWORD}" \
            --from-literal=DATABASE_URL="postgres://postgres:${DATABASE_PASSWORD}@kube-delivery-postgres:5432/delivery_db?sslmode=disable"
          set +e
          helm upgrade --install kube-delivery ./deploy/helm/kube-delivery-platform \
            --namespace delivery-preview \
            --wait \
            --timeout 3m \
            --values ./deploy/helm/kube-delivery-platform/values.yaml \
            --values ./deploy/helm/kube-delivery-platform/values-preview.yaml \
            --set shipmentApi.image.repository=ghcr.io/aaamer91/shipment-api \
            --set shipmentApi.image.tag=test \
            --set trackingWorker.image.repository=ghcr.io/aaamer91/tracking-worker \
            --set trackingWorker.image.tag=test
          HELM_EXIT=$?
          set -e

          if [[ "${HELM_EXIT}" -ne 0 ]]; then
            echo "::group::Helm failure diagnostics"
            helm status kube-delivery --namespace delivery-preview || true
            kubectl get pods,pvc,services,deployments,statefulsets,jobs \
              --namespace delivery-preview -o wide || true
            kubectl get events --namespace delivery-preview \
              --sort-by=.lastTimestamp || true
            for pod in $(kubectl get pods --namespace delivery-preview -o name 2>/dev/null); do
              pod_name="${pod#pod/}"
              phase=$(kubectl get "${pod}" --namespace delivery-preview -o jsonpath='{.status.phase}' 2>/dev/null || true)
              waiting=$(kubectl get "${pod}" --namespace delivery-preview -o jsonpath='{range .status.containerStatuses[*]}{.name}:{.state.waiting.reason}:{.state.terminated.reason}{";"}{end}' 2>/dev/null || true)
              echo "::error title=Preview pod ${pod_name}::phase=${phase}; containers=${waiting}"
              kubectl describe "${pod}" --namespace delivery-preview || true
              kubectl logs "${pod}" --namespace delivery-preview --all-containers --tail=100 || true
            done
            for claim in $(kubectl get pvc --namespace delivery-preview -o name 2>/dev/null); do
              claim_name="${claim#persistentvolumeclaim/}"
              claim_phase=$(kubectl get "${claim}" --namespace delivery-preview -o jsonpath='{.status.phase}' 2>/dev/null || true)
              echo "::error title=Preview PVC ${claim_name}::phase=${claim_phase}"
            done
            echo "::endgroup::"
            helm uninstall kube-delivery --namespace delivery-preview || true
            exit "${HELM_EXIT}"
          fi

      - name: Validate Argo CD Applications Against Installed CRDs
        run: |
          kubectl apply --dry-run=server --validate=strict -f deploy/argocd

      - name: Await Kubernetes Workload Readiness (kubectl wait)
        run: |
          echo "⏳ Waiting for PostgreSQL and NATS StatefulSets to be Ready..."
          kubectl rollout status statefulset/kube-delivery-postgres -n delivery-preview --timeout=180s
          kubectl rollout status statefulset/kube-delivery-nats -n delivery-preview --timeout=180s

          echo "⏳ Waiting for shipment-api and tracking-worker Deployments..."
          kubectl rollout status deployment/kube-delivery-shipment-api -n delivery-preview --timeout=180s
          kubectl rollout status deployment/kube-delivery-tracking-worker -n delivery-preview --timeout=180s

          echo "📋 Pods in delivery-preview namespace:"
          kubectl get pods -n delivery-preview -o wide

      - name: Execute Helm Test Hooks
        run: |
          helm test kube-delivery -n delivery-preview

      - name: Run Live Shipment Lifecycle Test
        run: |
          kubectl port-forward service/kube-delivery-shipment-api 18080:8080 -n delivery-preview > /tmp/port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill ${PORT_FORWARD_PID} 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz > /dev/null; then
              break
            fi
            if [[ ${attempt} -eq 20 ]]; then
              cat /tmp/port-forward.log
              exit 1
            fi
            sleep 1
          done
          API_BASE_URL=http://127.0.0.1:18080 REQUIRE_LIVE_E2E=true \
            python -m pytest tests/e2e/test_shipment_lifecycle.py -v

      - name: Run Chaos & Resilience Drills
        run: |
          echo "🔥 Running Chaos Drill 1: Terminating shipment-api pod and verifying self-healing..."
          API_POD=$(kubectl get pods -n delivery-preview -l app.kubernetes.io/name=shipment-api -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pod "$API_POD" -n delivery-preview
          REPLACEMENT_POD=""
          RECOVERED=false
          for attempt in {1..60}; do
            REPLACEMENT_POD=$(kubectl get pods -n delivery-preview \
              -l app.kubernetes.io/name=shipment-api \
              -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | tr ' ' '\n' | grep -v "^${API_POD}$" | head -n 1 || true)
            if [[ -n "${REPLACEMENT_POD}" ]] && \
              kubectl wait --for=condition=Ready "pod/${REPLACEMENT_POD}" -n delivery-preview --timeout=2s; then
              RECOVERED=true
              break
            fi
            sleep 2
          done
          if [[ "${RECOVERED}" != "true" ]]; then
            echo "ERROR: Deployment did not produce a new Ready pod after deletion."
            exit 1
          fi
          echo "Self-healing verified: ${API_POD} was replaced by ${REPLACEMENT_POD}."

          echo "🔥 Running Chaos Drill 2: Verifying NetworkPolicy isolation..."
          POSTGRES_IP=$(kubectl get service kube-delivery-postgres -n delivery-preview -o jsonpath='{.spec.clusterIP}')
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: rogue-pod
            namespace: delivery-preview
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: probe
                image: docker.io/library/busybox:1.36.1
                command: ["sleep", "3600"]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 10001
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 5m
                    memory: 8Mi
                  limits:
                    cpu: 25m
                    memory: 32Mi
          EOF
          kubectl wait --for=condition=Ready pod/rogue-pod -n delivery-preview --timeout=60s
          # Use the ClusterIP so a denied DNS request cannot masquerade as database isolation.
          if kubectl exec rogue-pod -n delivery-preview -- nc -zvw 3 "$POSTGRES_IP" 5432; then
            echo "❌ ERROR: NetworkPolicy failed to block unauthorized database access!"
            exit 1
          else
            echo "✅ NetworkPolicy successfully blocked unauthorized access to database."
          fi
          kubectl delete pod rogue-pod -n delivery-preview --force --grace-period=0 || true

      - name: Prove Kyverno Validates Init Containers
        run: |
          # Use a clean namespace: the application namespace's LimitRange fills
          # missing resources before validating admission webhooks can reject them.
          kubectl create namespace policy-validation
          kubectl label namespace policy-validation \
            platform.kube-delivery.io/security-profile=restricted \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest
          if kubectl apply --dry-run=server -f - > policy-denial.log 2>&1 <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: policy-violation
            namespace: policy-validation
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            initContainers:
              - name: unchecked-init
                image: docker.io/library/busybox:1.36.1
                command: ["sh", "-c", "true"]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 10001
                  capabilities:
                    drop: ["ALL"]
            containers:
              - name: compliant-app
                image: docker.io/library/busybox:1.36.1
                command: ["sleep", "30"]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 10001
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 5m
                    memory: 8Mi
                  limits:
                    cpu: 25m
                    memory: 32Mi
          EOF
          then
            echo "ERROR: Kyverno admitted an init container without resource requests and limits."
            exit 1
          fi
          cat policy-denial.log
          grep -E "require-resource-limits|CPU and memory requests and limits are required" policy-denial.log
          echo "Kyverno-specific init-container admission denial verified."

      - name: Run Test Suite & Generate Evidence Summary
        run: |
          python -m pytest tests/resilience -v
          python scripts/generate_summary.py

      - name: Capture Cluster Diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp || true
          kubectl describe pods -n delivery-preview || true

      - name: Delete Kind Cluster
        if: always()
        run: kind delete cluster --name kube-delivery-ci
