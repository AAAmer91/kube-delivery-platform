{{- if and .Values.networkPolicy.enabled .Values.nats.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-delivery.fullname" . }}-allow-nats
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: message-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    # Allow 4222 only from API and Worker, and 8222 from Prometheus/Monitoring
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shipment-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tracking-worker
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8222
{{- end }}
