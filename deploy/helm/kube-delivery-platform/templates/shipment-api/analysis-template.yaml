{{- if and .Values.shipmentApi.enabled .Values.shipmentApi.argoRollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "kube-delivery.fullname" . }}-shipment-api-analysis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  args:
    - name: namespace
    - name: canary-service
    - name: prometheus-server
      value: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  metrics:
    - name: success-rate
      interval: 10s
      failureLimit: 3
      successCondition: len(result) > 0 && !isNaN(result[0]) && result[0] <= 0.01
      failureCondition: len(result) == 0 || isNaN(result[0]) || result[0] > 0.01
      provider:
        prometheus:
          address: "{{ `{{ args.prometheus-server }}` }}"
          query: >-
            sum(rate(kube_delivery_shipment_api_http_requests_total{namespace="{{ `{{ args.namespace }}` }}",service="{{ `{{ args.canary-service }}` }}",status=~"5.."}[1m]))
            /
            sum(rate(kube_delivery_shipment_api_http_requests_total{namespace="{{ `{{ args.namespace }}` }}",service="{{ `{{ args.canary-service }}` }}"}[1m]))
    - name: latency-p99
      interval: 10s
      failureLimit: 3
      successCondition: len(result) > 0 && !isNaN(result[0]) && result[0] <= 0.500
      failureCondition: len(result) == 0 || isNaN(result[0]) || result[0] > 0.500
      provider:
        prometheus:
          address: "{{ `{{ args.prometheus-server }}` }}"
          query: >-
            (histogram_quantile(0.99,
              sum(rate(kube_delivery_shipment_api_http_request_duration_seconds_bucket{namespace="{{ `{{ args.namespace }}` }}",service="{{ `{{ args.canary-service }}` }}"}[1m])) by (le)))
{{- end }}
