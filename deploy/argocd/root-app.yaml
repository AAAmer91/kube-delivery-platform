apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-delivery-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AAAmer91/kube-delivery-platform.git
    targetRevision: HEAD
    path: deploy/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
