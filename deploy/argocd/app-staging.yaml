apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-delivery-staging
  namespace: argocd
  labels:
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/AAAmer91/kube-delivery-platform.git
    targetRevision: main
    path: deploy/helm/kube-delivery-platform
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        platform.kube-delivery.io/security-profile: restricted
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
