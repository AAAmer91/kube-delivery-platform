[project]
name = "tracking-worker"
version = "1.0.0"
description = "Cloud-Native NATS JetStream Event Consumer & Tracking Progress Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.8.0",
    "asyncpg>=0.29.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL"]
ignore = ["E501", "PLW0603", "PLR0913", "PLR2004"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]

[tool.mypy]

python_version = "3.12"
strict = true
ignore_missing_imports = true
